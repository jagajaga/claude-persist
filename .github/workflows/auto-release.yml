name: Auto Release

# Every push to main automatically bumps the extension patch version, tags
# vX.Y.Z, builds the self-contained .vsix, and publishes a GitHub release.
#
# Docs-only and CI-only pushes are skipped. The version-bump commit and tag
# are pushed with GITHUB_TOKEN, which never re-triggers workflows (GitHub's
# recursion guard) — that is also why this workflow builds and publishes the
# release itself instead of relying on release.yml (a GITHUB_TOKEN tag push
# would not fire it). release.yml still handles manually pushed v* tags.
on:
  push:
    branches:
      - main
    # Narrow on purpose: extension/README.md is the marketplace page and
    # extension/CHANGELOG.md is the Extensions view's Changelog tab, so both are
    # shipped content and a fix to them has to reach users. Ignoring every *.md
    # meant a correction to the listing never published — it rode along with the
    # next code push, or waited forever.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- tag
  # Version and tag exactly once, before anything is built. The packaging
  # matrix then checks out that tag, so every platform's vsix carries the
  # same version and the same code.
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the changelog is built from the range between
          # this release's tag and the previous one.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Before the bump, not after: the bump step pushes a tag, so a failure
      # later in the job leaves a published tag with no release behind it.
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Bump patch version, commit, and tag
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OLD=$(node -p "require('./extension/package.json').version")
          # npm's stdout is multi-line in workspaces — read the result from
          # the file instead of parsing it.
          (cd extension && npm version patch --no-git-tag-version >/dev/null)
          NEW=$(node -p "require('./extension/package.json').version")
          git add extension/package.json
          git commit -m "chore(extension): $OLD -> $NEW"
          git tag -a "v$NEW" -m "v$NEW"
          git push origin main "v$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------- package
  # One vsix per platform, each built on that platform.
  #
  # The native `claude` the SDK spawns ships as one npm package per platform,
  # and npm installs only the one matching the host — so the only honest way to
  # bundle a macOS or Windows binary is to run npm there. Cross-installing with
  # --force would work, but a binary nobody has ever executed is a poor thing to
  # ship to someone else's machine.
  #
  # The universal build carries no binary at all (1 MB rather than 100 MB) and
  # drives whatever Claude Code the user already has. It is the fallback for
  # every platform without a targeted build — Alpine, 32-bit, ARM Windows — and
  # the safety net if a matrix leg fails, which is why fail-fast is off.
  package:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: ''
            label: universal
          - runner: ubuntu-latest
            target: linux-x64
            label: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            label: linux-arm64
          # Intel macOS. GitHub retired the macos-13 label, and a matrix leg
          # naming a runner that no longer exists does not fail — it queues
          # forever, holding the release (and, through the concurrency group,
          # every release behind it). Hence the timeout below.
          - runner: macos-15-intel
            target: darwin-x64
            label: darwin-x64
          - runner: macos-latest
            target: darwin-arm64
            label: darwin-arm64
          - runner: windows-latest
            target: win32-x64
            label: win32-x64
    runs-on: ${{ matrix.runner }}
    # A leg that cannot start must fail rather than wait: publish tolerates a
    # missing platform, but nothing tolerates a job that never ends.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate changelog for the Extensions view
        shell: bash
        run: bash scripts/changelog.sh 3

      - name: Package
        shell: bash
        env:
          CP_TARGET: ${{ matrix.target }}
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.label }}
          path: claude-persist-*.vsix
          if-no-files-found: error
          retention-days: 3

  # -------------------------------------------------------------- publish
  publish:
    needs: [tag, package]
    # Even if a platform leg failed: a release missing one target beats a tag
    # with no release at all, and the universal build covers the gap.
    if: always() && needs.tag.result == 'success'
    runs-on: ubuntu-latest
    env:
      # Absent until the Open VSX token is added as a repo secret; the publish
      # step below is skipped while it is, so the release still succeeds.
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true

      - name: List what was built
        id: built
        run: |
          set -euo pipefail
          ls -la claude-persist-*.vsix
          V=${{ needs.tag.outputs.version }}
          # The universal build is the fallback every platform can install; a
          # release without it is worse than no release.
          test -f "claude-persist-${V}.vsix" || {
            echo "::error::universal vsix missing — refusing to publish a release nobody can install"
            exit 1
          }
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            test -f "claude-persist-${V}-${t}.vsix" \
              || echo "::warning::no build for ${t}; those users get the universal vsix"
          done

      - name: Publish release with vsix files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          name: v${{ needs.tag.outputs.version }}
          files: claude-persist-*.vsix
          generate_release_notes: true

      # Open VSX is the marketplace code-server uses by default, so publishing
      # here is what makes the Extensions view show a normal "Update" button
      # instead of the extension having to notify about itself.
      # Open VSX is a third-party service that returns 5xx from time to time.
      # The GitHub release is already published by this point, so a marketplace
      # hiccup must not mark the whole release failed — retry, then warn.
      - name: Publish to Open VSX
        if: env.OVSX_TOKEN != ''
        continue-on-error: true
        run: |
          set -uo pipefail
          publish() {
            for attempt in 1 2 3; do
              if npx --yes ovsx publish "$1" -p "$OVSX_TOKEN"; then
                echo "published $1 on attempt $attempt"
                return 0
              fi
              echo "::warning::Open VSX publish of $1, attempt $attempt, failed"
              sleep $((attempt * 30))
            done
            return 1
          }
          V=${{ needs.tag.outputs.version }}
          # The universal build first: it is the one every platform can fall
          # back to, so if only one publish lands, it should be that one.
          failed=0
          publish "claude-persist-${V}.vsix" || failed=1
          for f in claude-persist-${V}-*.vsix; do
            [ -e "$f" ] || continue
            publish "$f" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Open VSX publish failed after 3 attempts; the GitHub release is live. Re-run with scripts/publish-ovsx.sh once the service recovers."
            exit 1
          fi
