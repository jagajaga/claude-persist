name: Auto Release

# Every push to main automatically bumps the extension patch version, tags
# vX.Y.Z, builds the self-contained .vsix, and publishes a GitHub release.
#
# Docs-only and CI-only pushes are skipped. The version-bump commit and tag
# are pushed with GITHUB_TOKEN, which never re-triggers workflows (GitHub's
# recursion guard) — that is also why this workflow builds and publishes the
# release itself instead of relying on release.yml (a GITHUB_TOKEN tag push
# would not fire it). release.yml still handles manually pushed v* tags.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Absent until the Open VSX token is added as a repo secret; the publish
      # step below is skipped while it is, so the release still succeeds.
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the changelog is built from the range between
          # this release's tag and the previous one.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump patch version, commit, and tag
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OLD=$(node -p "require('./extension/package.json').version")
          # npm's stdout is multi-line in workspaces — read the result from
          # the file instead of parsing it.
          (cd extension && npm version patch --no-git-tag-version >/dev/null)
          NEW=$(node -p "require('./extension/package.json').version")
          git add extension/package.json
          git commit -m "chore(extension): $OLD -> $NEW"
          git tag -a "v$NEW" -m "v$NEW"
          git push origin main "v$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Generate changelog for the Extensions view
        run: bash scripts/changelog.sh 3

      - name: Install dependencies
        run: npm install

      - name: Build and package
        run: bash scripts/package.sh

      - name: Locate vsix
        id: vsix
        run: echo "file=$(ls claude-persist-*.vsix)" >> "$GITHUB_OUTPUT"

      - name: Publish release with vsix
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          files: ${{ steps.vsix.outputs.file }}
          generate_release_notes: true

      # Open VSX is the marketplace code-server uses by default, so publishing
      # here is what makes the Extensions view show a normal "Update" button
      # instead of the extension having to notify about itself.
      - name: Publish to Open VSX
        if: env.OVSX_TOKEN != ''
        run: npx --yes ovsx publish "${{ steps.vsix.outputs.file }}" -p "$OVSX_TOKEN"
