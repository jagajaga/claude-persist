name: Update Agent SDK

# Fully automatic: when a new @anthropic-ai/claude-agent-sdk ships (new
# Claude models arrive through it), bump it, build, commit to main, tag,
# and publish the release with the .vsix — no human in the loop. Installed
# extensions then pick it up via their built-in update check.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for newer SDK
        id: check
        run: |
          current=$(node -p "require('./package.json').dependencies['@anthropic-ai/claude-agent-sdk'].replace(/[^0-9.]/g,'')")
          latest=$(npm view @anthropic-ai/claude-agent-sdk version)
          echo "current=$current latest=$latest"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          [ "$current" != "$latest" ] && echo "bump=yes" >> "$GITHUB_OUTPUT" || echo "bump=no" >> "$GITHUB_OUTPUT"

      - name: Bump, build, package
        if: steps.check.outputs.bump == 'yes'
        id: bump
        run: |
          npm install @anthropic-ai/claude-agent-sdk@${{ steps.check.outputs.latest }}
          version=$(node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('extension/package.json','utf8'));
            const [a,b,c] = p.version.split('.').map(Number);
            p.version = [a, b, c+1].join('.');
            fs.writeFileSync('extension/package.json', JSON.stringify(p, null, 2) + '\n');
            console.log(p.version);
          ")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          bash scripts/package.sh
          echo "file=$(ls claude-persist-*.vsix)" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: steps.check.outputs.bump == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json extension/package.json
          git commit -m "chore(claude-agent-sdk): ${{ steps.check.outputs.current }} -> ${{ steps.check.outputs.latest }}"
          git tag -a "v${{ steps.bump.outputs.version }}" -m "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main "v${{ steps.bump.outputs.version }}"

      - name: Publish release
        if: steps.check.outputs.bump == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          files: ${{ steps.bump.outputs.file }}
          body: |
            Automated release: Claude Agent SDK ${{ steps.check.outputs.current }} → ${{ steps.check.outputs.latest }}.
            New Claude models ship through the SDK, so the model picker stays current.
            Installed extensions will offer this update automatically.
